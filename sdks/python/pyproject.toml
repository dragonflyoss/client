[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragonfly-cache"
version = "0.1.0"
description = "Python SDK for Dragonfly persistent cache (dfcache), enabling P2P-backed fast read/write cache for AI workloads"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Dragonfly Authors" }]
requires-python = ">=3.9"
keywords = ["dragonfly", "p2p", "cache", "dfcache", "ai", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "dragonfly-api>=2.3.0",
    "grpcio>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://d7y.io"
Repository = "https://github.com/dragonflyoss/client"

[tool.hatch.build.targets.wheel]
packages = ["dragonfly_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["dragonfly_cache"]
